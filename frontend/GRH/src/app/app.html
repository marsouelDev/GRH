<!-- Layout avec sidebar + navbar -->
<div class="app-layout" *ngIf="afficherLayout">
  <app-side-bar></app-side-bar>
  <div class="app-main">
    <app-nav-bar></app-nav-bar>
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Pages sans layout (login, 404) -->
<ng-container *ngIf="!afficherLayout">
  <router-outlet></router-outlet>
</ng-container>
