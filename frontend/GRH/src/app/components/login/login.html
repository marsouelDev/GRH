<div class="login-container">
  <h2>Connexion RH</h2>
  
  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Adresse Email :</label>
      <input id="email" type="email" formControlName="email">
      <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger">
        Veuillez entrer un email valide.
      </small>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe :</label>
      <input id="password" type="password" formControlName="password">
      <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger">
        Le mot de passe est obligatoire.
      </small>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
  </form>
</div>
