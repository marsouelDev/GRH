<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link
  href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap"

<div class="page-404">

  <!-- Formes décoratives flottantes -->
  <div class="deco deco--1"></div>
  <div class="deco deco--2"></div>
  <div class="deco deco--3"></div>
  <div class="deco deco--4"></div>

  <div class="container-404">

    <!-- Numéro 404 stylisé -->
    <div class="code-block">
      <span class="code-number">4</span>
      <div class="code-zero">
        <i class="bi bi-search"></i>
      </div>
      <span class="code-number">4</span>
    </div>

    <!-- Divider ondulé -->
    <div class="divider">
      <svg viewBox="0 0 200 12" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 6 Q25 0 50 6 T100 6 T150 6 T200 6" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" />
      </svg>
    </div>

    <!-- Image -->
    <div class="image-wrapper">
      <div class="image-badge">
        <i class="bi bi-exclamation-triangle-fill"></i>

      </div>
      <img src="assets/404/image 404 1.jpg" alt="Page introuvable" />
      <div class="image-shadow"></div>
    </div>

    <!-- Texte -->
    <div class="text-block">
      <h1>Cette page n'existe pas</h1>
      <p>La page que vous cherchez a peut-être été déplacée, supprimée ou n'a jamais existé.</p>
    </div>

    <!-- CTA -->
    <a routerLink="/login" class="btn-home">
      <i class="bi bi-house-door-fill"></i>
      page de connexion
      <i class="bi bi-arrow-right btn-arrow"></i>
    </a>

    <!-- Liens rapides -->
    <div class="quick-links">
      <span class="quick-links__label">Vous cherchez peut-être :</span>
      <a routerLink="/conges" class="quick-link">
        <i class="bi bi-grid-1x2-fill"></i>Conge
      </a>
      <a routerLink="/justifications" class="quick-link">
        <i class="bi bi-people-fill"></i> Justification
      </a>
      <a routerLink="/presences" class="quick-link">
        <i class="bi bi-clock-history"></i> Présences
      </a>
    </div>

  </div>
